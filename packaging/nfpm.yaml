# The .deb and .rpm for one Linux platform, built by scripts/dist.sh through
# nfpm (pinned in the Makefile). Read that script first: everything below that
# says ${DRIVEL_...} is filled in by it, and the files it names are ones it has
# just built into a staging directory.
#
# One description for both formats, so a fact about the package is stated once.
# Every src is relative to that staging directory, which is where dist.sh runs
# nfpm: nfpm expands ${VAR} in the version and the architecture, but not in a
# path.

name: drivel
arch: ${DRIVEL_ARCH}
platform: linux
version: ${DRIVEL_VERSION}
section: utils
priority: optional
maintainer: Jeremy Melanson <1080872+zish@users.noreply.github.com>
vendor: SystemHalted
homepage: https://syshlted.github.io/drivel/
license: MPL-2.0

# Backend-neutral on purpose: it says what drivel is, then names the backends
# this build ships, which is the rule for every piece of copy that describes the
# program. The warning is the short pointer docs/user/status.md asks for.
description: |
  Sync a folder on a storage provider through an ordinary directory
  Drivel mounts a directory with FUSE, keeps every file in a local copy and
  syncs it with a remote in the background, in both directions. It ships with
  backends for Google Drive and SFTP.

  Work in progress: it may lose data. Keep backups you have checked, and read
  https://syshlted.github.io/drivel/docs/status/ first.

# fusermount3 is the setuid helper an unprivileged FUSE mount needs, and both
# Debian and Fedora put it in a package of this name.
depends:
  - fuse3

contents:
  - src: drivel
    dst: /usr/bin/drivel
    file_info:
      mode: 0755

  # The mount(8) helper is the same binary under another name (M16). /usr/sbin
  # rather than the /sbin `make install` uses: every distribution this package
  # targets has merged /usr, where /sbin is a link to /usr/sbin and mount(8)'s
  # search of /sbin finds it there, and Debian's packaging rules now ask for the
  # /usr path, because a package shipping into the aliased directory can lose
  # files when another package moves.
  - src: /usr/bin/drivel
    dst: /usr/sbin/mount.fuse.drivel
    type: symlink
  - src: /usr/bin/drivel
    dst: /usr/sbin/mount.drivel
    type: symlink

  - src: drivel.1.gz
    dst: /usr/share/man/man1/drivel.1.gz
    file_info:
      mode: 0644

  # Printed by the binary itself (`drivel completion`), so they describe exactly
  # the flags this build has. zsh looks in a different directory on each family.
  - src: drivel.bash
    dst: /usr/share/bash-completion/completions/drivel
    file_info:
      mode: 0644
  - src: _drivel
    dst: /usr/share/zsh/vendor-completions/_drivel
    packager: deb
    file_info:
      mode: 0644
  - src: _drivel
    dst: /usr/share/zsh/site-functions/_drivel
    packager: rpm
    file_info:
      mode: 0644

  # The licence, where each family looks for it.
  - src: LICENSE
    dst: /usr/share/doc/drivel/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/drivel/LICENSE
    type: license
    packager: rpm
    file_info:
      mode: 0644
