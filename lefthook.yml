# Git hooks for drivel.   Install once per clone:  make hooks
#
# Every job shells out to a make target. The Makefile is the single definition
# of each gate, so a hook can never test something different from CI.
#
# Split by cost, deliberately: pre-commit stays under a few seconds because a
# hook slow enough to be annoying gets bypassed with --no-verify, and a hook
# everyone bypasses is worse than no hook — it manufactures false confidence.
# The expensive gates (race detector, full lint) run at push time instead.

min_version: 1.10.0

# Sourced by the generated hook scripts before lefthook runs. It is checked in,
# not generated, and it exists to fail loudly: the hook's own search ends by
# printing "Can't find lefthook in PATH" and exiting 0 — a hook that silently
# passes. lefthook itself comes from the OS package manager; nothing builds it.
#
# The leading ./ is required, not cosmetic: sh's `.` builtin searches PATH when
# its argument contains no slash, so a bare filename is never found in dash.
rc: ./.lefthook-rc.sh

pre-commit:
  parallel: true
  jobs:
    - name: format
      run: make fmt-check
      fail_text: "unformatted code — run: make fmt"

    - name: vet
      run: make vet

    - name: build
      run: make build

pre-push:
  parallel: false
  jobs:
    # The whole tree, not just the diff: the tree reports clean, and keeping it
    # that way is cheaper than paying down a backlog a second time. `make
    # lint-new` still exists for triaging a branch in isolation.
    - name: lint
      run: make lint
      fail_text: "lint findings — see them with: make lint"

    # Race detector on. Not -full: /dev/fuse and user xattrs are a CI
    # guarantee, not a laptop one, so requiring them here would fail pushes
    # from machines where skipping is the correct behaviour.
    - name: test
      run: make test

    # Signatures. Inline rather than a make target, for the same reason the
    # commit-msg job below is: CI cannot run this one. It reads the local
    # keyring to decide whether a commit is signed, so there is no gate for the
    # Makefile to be the single definition of — the rule this file states is
    # about gates that exist on both sides, and this one exists on neither.
    #
    # git's %G? reports N for no signature and B for a bad one; both are
    # refused. E is accepted: it means signed by a key absent from this
    # machine's keyring, which is what GitHub's own web-flow commits look like.
    #
    # The range is "not reachable from any remote ref" rather than stdin's push
    # refs, because lefthook consumes the hook's stdin to compute its own
    # templates, and rather than @-push, whose braces collide with lefthook's
    # {template} syntax.
    - name: signatures
      run: |
        unsigned=
        for commit in $(git rev-list HEAD --not --remotes); do
          case "$(git log -1 --format=%G? "$commit")" in
            N) unsigned="$unsigned $(git log -1 --format=%h "$commit") (unsigned)" ;;
            B) unsigned="$unsigned $(git log -1 --format=%h "$commit") (BAD)" ;;
          esac
        done
        if [ -n "$unsigned" ]; then
          echo "refusing to push:$unsigned"
          exit 1
        fi
      fail_text: "unsigned commits — sign a run of them with: git rebase --exec 'git commit --amend --no-edit -S' <base>"

commit-msg:
  jobs:
    - name: subject length
      run: |
        subject=$(head -1 "{1}")
        # Allow fixup!/squash! through untouched.
        case "$subject" in fixup!*|squash!*) exit 0 ;; esac
        if [ "${#subject}" -gt 72 ]; then
          echo "commit subject is ${#subject} chars; keep it under 72"
          exit 1
        fi
